apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jt-stress-tests-ingress
  labels:
    app.kubernetes.io/name: jt-stress-tests
    app.kubernetes.io/component: load-testing-engine
    app.kubernetes.io/part-of: jt-stress-tests-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stress.internal.local
      secretName: jt-stress-tests-tls
  rules:
    - host: stress.internal.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jt-stress-tests-svc
                port:
                  number: 8080
