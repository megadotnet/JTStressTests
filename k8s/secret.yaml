apiVersion: v1
kind: Secret
metadata:
  name: jt-stress-tests-secret
  labels:
    app.kubernetes.io/name: jt-stress-tests
    app.kubernetes.io/component: load-testing-engine
    app.kubernetes.io/part-of: jt-stress-tests-system
type: Opaque
# 敏感配置（如认证凭据、API Token）禁止硬编码明文，统一采用 Kubernetes Secret / KMS 托管注入
# 以下为标准示例配置（占位符）
stringData:
  API_AUTH_TOKEN: "Bearer-sample-secure-token-placeholder"
  TARGET_API_KEY: "sample-secure-api-key"
