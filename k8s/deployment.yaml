apiVersion: apps/v1
kind: Deployment
metadata:
  name: jt-stress-tests
  labels:
    app.kubernetes.io/name: jt-stress-tests
    app.kubernetes.io/component: load-testing-engine
    app.kubernetes.io/part-of: jt-stress-tests-system
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: jt-stress-tests
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jt-stress-tests
        app.kubernetes.io/component: load-testing-engine
        app.kubernetes.io/part-of: jt-stress-tests-system
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/healthz"
    spec:
      # 安全上下文：禁止容器以 root 身份运行，遵循最小特权原则
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: jt-stress-tests
          image: jt-stress-tests:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "/app/JTStressTests.dll"]
          args: ["--server", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # 容器级安全加固
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # 环境变量注入：非敏感信息从 ConfigMap，敏感密钥从 Secret 注入
          envFrom:
            - configMapRef:
                name: jt-stress-tests-config
          env:
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jt-stress-tests-secret
                  key: API_AUTH_TOKEN
            - name: TARGET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jt-stress-tests-secret
                  key: TARGET_API_KEY

          # 资源配额与限制（Requests / Limits）
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          # 存活探针（Liveness Probe）
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # 就绪探针（Readiness Probe）
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          # 启动探针（Startup Probe）适配慢启动容器
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 10

          # 存储卷挂载（持久化测试报告与只读文件系统适配的临时缓存目录）
          volumeMounts:
            - name: reports-volume
              mountPath: /app/output
            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: reports-volume
          persistentVolumeClaim:
            claimName: jt-stress-tests-reports-pvc
        - name: tmp-volume
          emptyDir: {}
